name: Verify formatting 🎨

on:
  workflow_dispatch:
  # pull_request: DISABLED
  #   branches: [main]

permissions:
  contents: read

jobs:
  formatting:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Version comes from the "packageManager" field in package.json; setting
      # a different one here makes the action fail.
      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: |
          pnpm run prettier:check

      - name: Fail if formatting check failed
        if: failure()
        run: |
          echo "Formatting check failed. Please format your code according to the project's Prettier configuration."
          exit 1
